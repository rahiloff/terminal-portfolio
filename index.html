<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mohammed Rahil | Terminal</title>
    
    <!-- Fira Code Font for authentic terminal look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #00ff41; /* Classic Terminal Green */
            --prompt-user: #00E5FF; /* Cyan */
            --prompt-host: #ff0055; /* Pink/Red */
            --prompt-path: #f0a030; /* Yellow */
            --glow: 0 0 5px rgba(0, 255, 65, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Fira Code', monospace;
            font-size: 15px;
            line-height: 1.5;
            overflow: hidden; /* Hide outer scroll, handle inside terminal */
        }

        /* CRT Scanline Effect */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #terminal-wrapper {
            height: 100%;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            text-shadow: var(--glow);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #004411;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-color);
        }

        .output-line {
            margin-bottom: 4px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .output-block {
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Prompt Styling */
        .prompt-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 10px;
        }

        .prompt {
            white-space: pre;
            display: flex;
        }

        .prompt .user { color: var(--prompt-user); font-weight: bold; }
        .prompt .at { color: #fff; }
        .prompt .host { color: var(--prompt-host); font-weight: bold; }
        .prompt .colon { color: #fff; }
        .prompt .path { color: var(--prompt-path); font-weight: bold; }
        .prompt .symbol { color: #fff; margin-right: 8px; }

        /* Input Handling */
        #cmd-input {
            background: transparent;
            border: none;
            color: transparent; /* Hide actual text, show via span */
            outline: none;
            font-family: inherit;
            font-size: 16px; /* Crucial: Prevents iOS auto-zoom */
            width: 1px;
            height: 1px;
            position: fixed;
            top: -100px;
            opacity: 0;
        }

        #input-display {
            color: #fff;
            white-space: pre;
        }

        /* Blinking Cursor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: #fff;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Formatting Classes */
        .table { display: table; width: 100%; max-width: 800px; margin-top: 10px; }
        .tr { display: table-row; }
        .td { display: table-cell; padding: 4px 10px 4px 0; }
        .th { display: table-cell; padding: 4px 10px 4px 0; font-weight: bold; color: var(--prompt-user); border-bottom: 1px dashed var(--text-color); }
        
        .highlight { color: #fff; font-weight: bold; }
        .accent { color: var(--prompt-path); }
        .error { color: #ff3333; }
        
        .ascii-art {
            color: var(--prompt-user);
            font-size: clamp(5px, 2vw, 12px);
            line-height: 1.2;
            margin-bottom: 15px;
            overflow-x: hidden;
            white-space: pre;
        }
        
        .neofetch-container {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .neofetch-logo {
            color: #E95420;
            font-weight: bold;
            line-height: 1.2;
            font-size: clamp(8px, 2.5vw, 13px);
            white-space: pre;
        }

        @media (max-width: 768px) {
            body { font-size: 13px; }
            #terminal-wrapper { padding: 12px; }
            .neofetch-container { gap: 10px; }
        }
    </style>
</head>
<body class="crt">

    <div id="terminal-wrapper" onclick="document.getElementById('cmd-input').focus()">
        <div id="output"></div>
        
        <div class="prompt-line" id="input-line" style="display: none;">
            <div class="prompt">
                <span class="user">rahil</span><span class="at">@</span><span class="host">cloud-server</span><span class="colon">:</span><span class="path">~</span><span class="symbol">$</span>
            </div>
            <span id="input-display"></span><span class="cursor"></span>
        </div>
        
        <!-- Hidden real input field for mobile keyboard support -->
        <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <script>
        const outputDiv = document.getElementById('output');
        const inputLine = document.getElementById('input-line');

        const inputDisplay = document.getElementById('input-display');
        const terminalWrapper = document.getElementById('terminal-wrapper');

        // ASCII Art Banner
        const banner = `
    __  ___      __                                      __   ____        __    _ __
   /  |/  /___  / /_  ____ _____ ___  ____ ___  ___  ____/ /  / __ \\____ _/ /_  (_) /
  / /|_/ / __ \\/ __ \\/ __ \\\`/ __ \\\`__ \\/ __ \\\`__ \\/ _ \\/ __  /  / /_/ / __ \\\`/ __ \\/ / / 
 / /  / / /_/ / / / / /_/ / / / / / / / / / / /  __/ /_/ /  / _, _/ /_/ / / / / / /

`;

        // Content Database

  <span class="highlight">matrix</span>     - Enter the matrix

            "skills": `Technical Stack Loaded:

            "projects": `Scanning deployed architecture...

            "contact": `Establishing secure connection...

<span class="accent">Email:</span>    <a href="mailto:rahilkkln@gmail.com" style="color: #fff; text-decoration: none;">rahilkkln@gmail.com</a>
<span class="accent">Phone:</span>    +91 7994568572
<span class="accent">LinkedIn:</span> <a href="https://linkedin.com/in/rahilt" target="_blank" style="color: #fff; text-decoration: none;">linkedin.com/in/rahilt</a>
<span class="accent">GitHub:</span>   <a href="https://github.com/rahiloff" target="_blank" style="color: #fff; text-decoration: none;">github.com/rahiloff</a>`,
            
            "gui": `Initiating X11 window system...<br><br><span class="accent">Redirecting to Graphical Portfolio...</span>`
        };

        // Boot Sequence Simulation
        const bootSequence = [
            "Mounting root filesystem... [OK]",
            "Starting networking service... [OK]",
            "Loading cloud configuration profiles... [OK]",
            "Initializing Docker daemon... [OK]",
            "Starting kubelet... [OK]",
            "Establishing connection to AWS/Azure environments... [OK]",
            "Welcome to R.OS v2.0.26 LTS",
            "Type 'help' to see available commands."
        ];

        async function typeText(text, element, speed = 10) {
            return new Promise(resolve => {
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        terminalWrapper.scrollTop = terminalWrapper.scrollHeight;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        async function runBootSequence() {
            // Print ASCII Art instantly
            const bannerDiv = document.createElement('div');
            bannerDiv.className = 'ascii-art';
            bannerDiv.innerHTML = banner;
            outputDiv.appendChild(bannerDiv);

            // Print boot lines
            for (let i = 0; i < bootSequence.length; i++) {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'output-line';
                outputDiv.appendChild(lineDiv);
                await typeText(bootSequence[i], lineDiv, i === bootSequence.length - 2 ? 30 : 5);
                await new Promise(r => setTimeout(r, 100)); // slight pause between lines
            }

            const br = document.createElement('br');
            outputDiv.appendChild(br);
            
            // Show prompt
            inputLine.style.display = 'flex';
            cmdInput.focus();
            terminalWrapper.scrollTop = terminalWrapper.scrollHeight;
        }

        // Command History State
        const commandHistory = [];
        let historyIndex = -1;

        // Handle Input
        cmdInput.addEventListener('input', function() {
            inputDisplay.textContent = this.value;
        });

        cmdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = this.value.trim();
                if (command) {
                    commandHistory.push(command);
                    historyIndex = commandHistory.length;
                }
                
                this.value = '';
                inputDisplay.textContent = '';
                processCommand(command.toLowerCase());
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    this.value = commandHistory[historyIndex];
                    inputDisplay.textContent = this.value;
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    this.value = commandHistory[historyIndex];
                    inputDisplay.textContent = this.value;
                } else {
                    historyIndex = commandHistory.length;
                    this.value = '';
                    inputDisplay.textContent = '';
                }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const current = this.value.toLowerCase();
                const cmds = Object.keys(fileSystem).concat(['ls', 'sudo', 'sudo rm -rf /', 'matrix', 'neofetch', 'theme', 'cat', 'whoami.txt', 'skills.json', 'experience.log', 'contact.cfg']);
                const match = cmds.find(c => c.startsWith(current));
                if (match) {
                    this.value = match;
                    inputDisplay.textContent = this.value;
                }
            }
        });

        function printPrompt(cmdText) {
            const promptHTML = `
                <div class="prompt-line">
                    <div class="prompt">
                        <span class="user">rahil</span><span class="at">@</span><span class="host">cloud-server</span><span class="colon">:</span><span class="path">~</span><span class="symbol">$</span>
                    </div>
                    <span style="color: #fff; margin-left: 8px;">${cmdText}</span>
                </div>
            `;
            outputDiv.insertAdjacentHTML('beforeend', promptHTML);
        }

        function printOutput(htmlContent) {
            const outDiv = document.createElement('div');
            outDiv.className = 'output-block';
            outDiv.innerHTML = htmlContent;
            outputDiv.appendChild(outDiv);
            terminalWrapper.scrollTop = terminalWrapper.scrollHeight;
        }

        function processCommand(cmd) {
            if (!cmd) {
                printPrompt("");
                return;
            }

            printPrompt(cmd);

            // Handle specific commands
            if (cmd === 'clear') {
                outputDiv.innerHTML = '';
                return;
            }

            if (cmd === 'download') {
                printOutput("Initiating secure file transfer... <br><span class='accent'>Opening Mohammed_Rahil_CV.pdf...</span>");
                setTimeout(() => {
                    window.open('Mohammed_Rahil_CV_.pdf', '_blank');
                }, 800);
                return;
            }

            if (cmd === 'date') {
                printOutput(new Date().toString());
                return;
            }

            if (cmd === 'gui') {
                printOutput(fileSystem['gui']);
                // Redirects after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'https://therahil.shop'; 
                }, 1500);
                return;
            }
            
            if (cmd.startsWith('theme')) {
                const parts = cmd.split(' ');
                if (parts.length === 1) {
                    printOutput("Available themes: <span class='highlight' style='color:#00ff41'>green</span>, <span class='highlight' style='color:#FFB000'>amber</span>, <span class='highlight' style='color:#00FFFF'>cyan</span>, <span class='highlight' style='color:#ff79c6'>dracula</span><br>Usage: theme [color]");
                    return;
                }
                const color = parts[1];
                const themes = {
                    green: { text: '#00ff41', glow: 'rgba(0, 255, 65, 0.4)' },
                    amber: { text: '#FFB000', glow: 'rgba(255, 176, 0, 0.4)' },
                    cyan:  { text: '#00FFFF', glow: 'rgba(0, 255, 255, 0.4)' },
                    dracula: { text: '#ff79c6', glow: 'rgba(255, 121, 198, 0.4)' }
                };
                if (themes[color]) {
                    document.documentElement.style.setProperty('--text-color', themes[color].text);
                    document.documentElement.style.setProperty('--glow', '0 0 5px ' + themes[color].glow);
                    printOutput(`Theme switched to <span style="color:${themes[color].text}">${color}</span>.`);
                } else {
                    printOutput(`<span class="error">Theme '${color}' not found.</span>`);
                }
                return;
            }

            if (cmd.startsWith('cat ')) {
                const file = cmd.split(' ')[1];
                const fileMap = {
                    'whoami.txt': 'whoami',
                    'skills.json': 'skills',
                    'experience.log': 'experience',
                    'contact.cfg': 'contact',
                    'help.sh': 'help'
                };
                if (fileMap[file]) {
                    printOutput(fileSystem[fileMap[file]]);
                } else if (file === 'projects.dir') {
                    printOutput("<span class='error'>cat: projects.dir: Is a directory</span>");
                } else {
                    printOutput(`<span class="error">cat: ${file}: No such file or directory</span>`);
                }
                return;
            }

            if (cmd.startsWith('echo ')) {
                printOutput(cmd.substring(5));
                return;
            }

            if (cmd === 'sudo rm -rf /' || cmd === 'sudo rm -rf /*') {
                inputLine.style.display = 'none';
                cmdInput.disabled = true;
                printOutput("<span class='error' style='font-weight:bold;'>[FATAL] ROOT PRIVILEGES DETECTED. INITIATING SYSTEM WIPEOUT...</span>");
                
                let count = 0;
                const crashInterval = setInterval(() => {
                    const files = ['/boot/vmlinuz', '/etc/shadow', '/usr/bin/bash', '/home/rahil/projects.dir', '/var/log/syslog', '/dev/sda1'];
                    printOutput(`<span class='error'>rm: cannot remove '${files[Math.floor(Math.random()*files.length)]}': Permission denied</span>`);
                    count++;
                    if (count > 35) {
                        clearInterval(crashInterval);
                        document.body.classList.remove('crt');
                        document.body.style.backgroundColor = '#aa0000';
                        document.body.innerHTML = '<div style="color: white; font-size: 1.5rem; text-align: center; margin-top: 30vh; font-family: monospace;">KERNEL PANIC - NOT SYNCING: FATAL EXCEPTION<br><br>System memory corrupted.<br>Rebooting in 3 seconds...</div>';
                        setTimeout(() => location.reload(), 3500);
                    }
                }, 40);
                return;
            }

            if (cmd.startsWith('sudo')) {
                printOutput("<span class='error'>rahil is not in the sudoers file. This incident will be reported.</span>");
                return;
            }

            if (cmd === 'matrix') {
                inputLine.style.display = 'none';
                cmdInput.disabled = true;
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%""\'#&_(),.;:?!\\|{}<>[]^~';
                let matrixCount = 0;
                const matrixInterval = setInterval(() => {
                    let line = '';
                    for (let i = 0; i < 60; i++) {
                        line += chars.charAt(Math.floor(Math.random() * chars.length)) + ' ';
                    }
                    printOutput(`<span style="color: #00ff41; opacity: ${0.4 + Math.random() * 0.6};">${line}</span>`);
                    matrixCount++;
                    if (matrixCount > 50) {
                        clearInterval(matrixInterval);
                        cmdInput.disabled = false;
                        inputLine.style.display = 'flex';
                        printOutput("<br>Matrix connection terminated.<br>");
                        cmdInput.focus();
                        terminalWrapper.scrollTop = terminalWrapper.scrollHeight;
                    }
                }, 50);
                return;
            }
            
            if (cmd === 'neofetch') {
                const uptime = Math.max(1, Math.floor(performance.now() / 60000));
                const neo = `<div class="neofetch-container">
<div class="neofetch-logo">
         _-_         
      /~~   ~~\\      
   /~~         ~~\\   
  {               }  
   \\  _-     -_  /   
     ~  \\\\ //  ~     
  _- -   | | _- _    
    _ -  | |   -_    
        // \\\\        
</div>
<div>
<span class="highlight">rahil</span><span style="color:#fff;">@</span><span class="host">cloud-server</span>
<span style="color:#fff;">-------------------</span>
<span class="highlight">OS:</span> R.OS v2.0.26 LTS
<span class="highlight">Host:</span> AWS EC2 t3.micro
<span class="highlight">Kernel:</span> 5.15.0-cloud-generic
<span class="highlight">Uptime:</span> ${uptime} mins
<span class="highlight">Packages:</span> 1420 (dpkg), 18 (helm)
<span class="highlight">Shell:</span> bash 5.1.16
<span class="highlight">Role:</span> DevOps & Cloud Engineer
<span class="highlight">CPU:</span> AWS Graviton2 (2) @ 2.500GHz
<span class="highlight">Memory:</span> 482MiB / 1024MiB
</div>
</div>`;
                printOutput(neo);
                return;
            }

            if (cmd === 'ls') {
                 printOutput("<span class='accent'>help.sh  whoami.txt  skills.json  experience.log  projects.dir  contact.cfg</span>");
                 return;
            }

            // Lookup command in filesystem
            const response = fileSystem[cmd];

            if (response) {
                printOutput(response);
            } else {
                printOutput(`<span class="error">bash: ${cmd}: command not found</span><br>Type 'help' to see available commands.`);
            }
        }

        // Start Boot Sequence
        window.onload = runBootSequence;

        // Keep input focused
        document.addEventListener('click', () => {
            cmdInput.focus();
        });

    </script>
</body>
</html>
